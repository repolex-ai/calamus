[package]
name = "calamus"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Prepare a parsed SPARQL query for an oxigraph store: rewrite it from an ontology, put values into its parameters, resolve short addresses"
repository = "https://github.com/repolex-ai/calamus"
publish = false

# calamus works on the query types of spargebra, the parser oxigraph is built
# from, so a prepared query is handed to oxigraph with no print and re-parse.
# The host's own oxigraph decides which 0.4.x is used; calamus only asks for
# one new enough. It has no file access, no network and no async runtime.
[dependencies]
oxrdf = { version = "0.3.3", features = ["rdf-12"] }
spargebra = { version = "0.4.6", features = ["sparql-12"] }
oxttl = { version = "0.2.3", features = ["rdf-12"], optional = true }

[features]
default = []
# Read an ontology from Turtle text the host already holds in memory.
turtle = ["dep:oxttl"]
# Pass-throughs, for a host that turns these on in spargebra itself.
sep-0002 = ["spargebra/sep-0002"]
sep-0006 = ["spargebra/sep-0006"]

[dev-dependencies]
oxigraph = { version = "0.5.6", default-features = false, features = ["rdf-12"] }
oxttl = { version = "0.2.3", features = ["rdf-12"] }

[[test]]
name = "conformance"
required-features = ["turtle"]
